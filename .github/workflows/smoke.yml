name: Smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of deployed worker
        required: true
        type: string
      environment:
        description: GitHub environment to bind (staging/production)
        required: true
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      environment:
        required: true
        type: string
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify base_url provided
        env:
          TEST_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ -z "$TEST_BASE_URL" ]; then
            echo "::error::base_url input is empty" >&2
            exit 1
          fi
      - name: Run smoke tests
        env:
          TEST_BASE_URL: ${{ inputs.base_url }}
        run: bun run deploy:verify
