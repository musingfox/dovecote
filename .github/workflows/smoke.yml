# Reusable smoke workflow. Caller must pass `environment` as one of
# { staging, production } — workflow_call cannot validate via type:choice,
# so an arbitrary string would bind to a non-existent GitHub Environment
# and silently bypass reviewer/branch protection rules.
name: Smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of deployed worker
        required: true
        type: string
      environment:
        description: GitHub environment to bind (staging/production)
        required: true
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      environment:
        required: true
        type: string
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify base_url provided
        env:
          TEST_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ -z "$TEST_BASE_URL" ]; then
            echo "::error::base_url input is empty"
            exit 1
          fi
      - name: Run smoke tests
        env:
          TEST_BASE_URL: ${{ inputs.base_url }}
        run: bun run deploy:verify
