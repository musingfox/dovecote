name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            binary: dovecote
          - target: bun-linux-arm64
            runner: ubuntu-latest
            archive: tar.gz
            binary: dovecote
          - target: bun-darwin-x64
            runner: macos-latest
            archive: tar.gz
            binary: dovecote
          - target: bun-darwin-arm64
            runner: macos-latest
            archive: tar.gz
            binary: dovecote
          - target: bun-windows-x64
            runner: ubuntu-latest
            archive: zip
            binary: dovecote.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary (${{ matrix.target }})
        working-directory: cli
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile dist/${{ matrix.binary }}

      - name: Package archive
        working-directory: cli/dist
        run: |
          ASSET="dovecote-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "$ASSET" "${{ matrix.binary }}"
          else
            tar -czf "$ASSET" "${{ matrix.binary }}"
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dovecote-${{ matrix.target }}
          path: cli/dist/dovecote-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Compute SHA256SUMS
        working-directory: release
        run: |
          sha256sum *.tar.gz *.zip 2>/dev/null | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
