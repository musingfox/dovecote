name: "Setup dovecote"
description: "Install the dovecote CLI and verify checksum + reachability."
# Usage notes:
#   Legacy mode:  provide `token` input — the token is exported directly, no HTTP exchange.
#   OIDC mode:    provide `oidc-audience` (and leave `token` empty); `server-url` is required.
#                 The job must declare `permissions: id-token: write`.
#                 Constraint-4: place this step immediately before first dovecote CLI usage,
#                 not at job start, to minimise the live-token window.
#   Mutual exclusion: setting both `token` and `oidc-audience` is an error.

inputs:
  version:
    description: "Release version to install (e.g., 0.1.0)."
    required: true
  token:
    description: "DOVECOTE_TOKEN to export into env (legacy mode). If unset, the action leaves the caller's DOVECOTE_TOKEN env var (if any) untouched, unless oidc-audience is provided."
    required: false
  oidc-audience:
    description: "Audience for GitHub Actions OIDC exchange. When set (and token is empty), the action exchanges a GitHub OIDC id_token for a dovecote token. server-url is implicitly required in this mode."
    required: false
  server-url:
    description: "Override DOVECOTE_SERVER_URL. Required when using oidc-audience."
    required: false
  repository:
    description: "GitHub repo (owner/name) hosting the release. Defaults to the action's repo."
    required: false
    default: "musingfox/dovecote"

runs:
  using: "composite"
  steps:
    - name: Resolve target triple
      id: target
      shell: bash
      run: |
        case "${RUNNER_OS}" in
          Linux)
            case "${RUNNER_ARCH}" in
              X64) echo "triple=bun-linux-x64" >> "$GITHUB_OUTPUT"; echo "ext=tar.gz" >> "$GITHUB_OUTPUT"; echo "bin=dovecote" >> "$GITHUB_OUTPUT";;
              ARM64) echo "triple=bun-linux-arm64" >> "$GITHUB_OUTPUT"; echo "ext=tar.gz" >> "$GITHUB_OUTPUT"; echo "bin=dovecote" >> "$GITHUB_OUTPUT";;
              *) echo "Unsupported arch: ${RUNNER_ARCH}" >&2; exit 1;;
            esac
            ;;
          macOS)
            case "${RUNNER_ARCH}" in
              X64) echo "triple=bun-darwin-x64" >> "$GITHUB_OUTPUT"; echo "ext=tar.gz" >> "$GITHUB_OUTPUT"; echo "bin=dovecote" >> "$GITHUB_OUTPUT";;
              ARM64) echo "triple=bun-darwin-arm64" >> "$GITHUB_OUTPUT"; echo "ext=tar.gz" >> "$GITHUB_OUTPUT"; echo "bin=dovecote" >> "$GITHUB_OUTPUT";;
              *) echo "Unsupported arch: ${RUNNER_ARCH}" >&2; exit 1;;
            esac
            ;;
          Windows)
            echo "triple=bun-windows-x64" >> "$GITHUB_OUTPUT"
            echo "ext=zip" >> "$GITHUB_OUTPUT"
            echo "bin=dovecote.exe" >> "$GITHUB_OUTPUT"
            ;;
          *) echo "Unsupported OS: ${RUNNER_OS}" >&2; exit 1;;
        esac

    - name: Download release archive
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        REPO="${{ inputs.repository }}"
        TRIPLE="${{ steps.target.outputs.triple }}"
        EXT="${{ steps.target.outputs.ext }}"
        BASE="https://github.com/${REPO}/releases/download/cli-v${VERSION}"
        mkdir -p "$RUNNER_TEMP/dovecote"
        cd "$RUNNER_TEMP/dovecote"
        echo "Downloading ${BASE}/dovecote-${TRIPLE}.${EXT}"
        if ! curl -fsSL -o "archive.${EXT}" "${BASE}/dovecote-${TRIPLE}.${EXT}" ; then
          echo "release not found: ${BASE}/dovecote-${TRIPLE}.${EXT}" >&2
          exit 1
        fi
        curl -fsSL -o SHA256SUMS "${BASE}/SHA256SUMS"

    - name: Verify checksum
      shell: bash
      run: |
        TRIPLE="${{ steps.target.outputs.triple }}"
        EXT="${{ steps.target.outputs.ext }}"
        cd "$RUNNER_TEMP/dovecote"
        EXPECTED=$(grep "dovecote-${TRIPLE}.${EXT}" SHA256SUMS | awk '{print $1}')
        if [ -z "$EXPECTED" ]; then
          echo "Checksum verification failed: no entry for dovecote-${TRIPLE}.${EXT}" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL=$(sha256sum "archive.${EXT}" | awk '{print $1}')
        else
          ACTUAL=$(shasum -a 256 "archive.${EXT}" | awk '{print $1}')
        fi
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "Checksum verification failed (expected ${EXPECTED}, got ${ACTUAL})" >&2
          exit 1
        fi
        echo "Checksum OK: ${ACTUAL}"

    - name: Extract and install
      shell: bash
      run: |
        EXT="${{ steps.target.outputs.ext }}"
        BIN="${{ steps.target.outputs.bin }}"
        cd "$RUNNER_TEMP/dovecote"
        if [ "$EXT" = "zip" ]; then
          unzip -o "archive.${EXT}"
        else
          tar -xzf "archive.${EXT}"
        fi
        chmod +x "${BIN}"
        echo "$RUNNER_TEMP/dovecote" >> "$GITHUB_PATH"

    - name: Export env
      shell: bash
      run: |
        # Mutual exclusion: token and oidc-audience must not both be provided.
        if [ -n "${{ inputs.token }}" ] && [ -n "${{ inputs.oidc-audience }}" ]; then
          echo "setup-dovecote: cannot set both 'token' and 'oidc-audience' — choose one mode." >&2
          exit 1
        fi
        if [ -n "${{ inputs.token }}" ]; then
          echo "DOVECOTE_TOKEN=${{ inputs.token }}" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.server-url }}" ]; then
          echo "DOVECOTE_SERVER_URL=${{ inputs.server-url }}" >> "$GITHUB_ENV"
        fi

    - name: OIDC token exchange
      if: ${{ inputs.token == '' && inputs.oidc-audience != '' }}
      shell: bash
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        DOVECOTE_SERVER_URL: ${{ inputs.server-url }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        MODE: oidc
      run: |
        bash "${{ github.action_path }}/../../scripts/oidc-exchange.sh"

    - name: Smoke probe
      shell: bash
      run: |
        dovecote --version || echo "dovecote --version skipped"
        if [ -n "${{ inputs.server-url }}" ]; then
          dovecote ping --server-url "${{ inputs.server-url }}" || true
        fi
