pre-commit:
  commands:
    hook-guard:
      run: .githooks/hook-guard-pre-commit
    no-empty-props-in-auth:
      glob: "src/auth/*.ts"
      run: |
        command -v rg >/dev/null || { echo "ripgrep required for no-empty-props-in-auth guard"; exit 1; }
        if rg -l 'props:\s*\{\s*\}' {staged_files} ; then
          echo "Empty props:{} found in src/auth/** — populate with {userId, scopes}"
          exit 1
        fi
    no-audit-string-concat:
      glob: "src/**/*.ts"
      run: |
        command -v rg >/dev/null || { echo "ripgrep required for no-audit-string-concat guard"; exit 1; }
        if rg -n 'writeAudit\([^)]*\+\s*[a-zA-Z_"`'\'']' {staged_files} ; then
          echo "String concatenation inside writeAudit payload — pass raw fields; writeAudit sanitizes."
          exit 1
        fi
    no-bun-api-in-src:
      glob: "src/**/*.ts"
      run: |
        command -v rg >/dev/null || { echo "ripgrep required for no-bun-api-in-src guard"; exit 1; }
        if rg -n '\bBun\.' {staged_files} ; then
          echo "Bun.* API found in src/** — worker module must stay portable; move Bun-specific code to cli/ or scripts/."
          exit 1
        fi
